# Default logging configuration for FeatureFlagsHQ Java SDK

# Root logger configuration
.level = WARNING
handlers = java.util.logging.ConsoleHandler

# Console handler configuration
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# FeatureFlagsHQ SDK logger configuration
com.featureflagshq.sdk.level = INFO
com.featureflagshq.sdk.handlers = java.util.logging.ConsoleHandler
com.featureflagshq.sdk.useParentHandlers = false

# Simple formatter pattern
java.util.logging.SimpleFormatter.format = %1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS [%4$s] %5$s%6$s%n

# Specific loggers
com.featureflagshq.sdk.FeatureFlagsHQSDK.level = INFO
com.featureflagshq.sdk.utils.level = WARNING
com.featureflagshq.sdk.exceptions.level = SEVERE